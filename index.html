<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>The 12th Composer’s Night | 사이트 준비 중</title>
  <style>
    * { box-sizing: border-box; }
    html, body { min-height: 100%; }
    body {
      margin: 0;
      display: grid;
      place-items: center;
      min-height: 100vh;
      padding: 24px;
      background: #000;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
      text-align: center;
    }
    main { max-width: 640px; }
    .logo { display: block; width: 104px; height: 104px; object-fit: cover; border-radius: 50%; margin: 38px auto 0; }
    .eyebrow { margin: 0 0 20px; color: #aaa; font-size: 12px; letter-spacing: .28em; }
    h1 { margin: 0; font-size: clamp(30px, 7vw, 56px); font-weight: 500; letter-spacing: -.04em; }
    .message { margin: 22px 0 0; color: #ccc; font-size: 16px; letter-spacing: .02em; }
    .affiliation { margin: 16px 0 0; color: #888; font-size: 13px; line-height: 1.8; letter-spacing: .04em; }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">THE 12TH COMPOSER’S NIGHT</p>
    <h1>제12회 작곡의 밤</h1>
    <div class="message">사이트 준비 중입니다.</div>
    <img class="logo" src="composer-night-assets/hanyang-symbol.png" alt="한양대학교 파란색 원형 심볼">
    <p class="affiliation">한양대학교 예체능대학 실용음악과</p>
  </main>
</body>
</html>
